# 孤立词预训练配置
# 用法: python pretrain_isolated.py --config configs/pretrain_isolated.yaml

data_dir: "SLR_Dataset/keypoints"
vocab: "vocab.json"

model:
  input_dim: 84
  d_model: 256
  num_heads: 4
  num_blocks: 4
  dropout: 0.3

training:
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.1
  max_epochs: 100
  patience: 15
  grad_clip: 5.0
  amp: true
  pooling: "attention"  # attention | mean
